# 야구백과사전 설명 영상 프로젝트 설정 (aivs run 용)
# 백업 영상 공급자(google_flow)는 Provider Router 라우팅 정책(generate_video: higgsfield->google_flow)에서
# 처리된다. Project Configuration 스키마의 providers 섹션에는 backup 필드가 없어 여기서 지정하지 않는다.
project:
  name: Baseball Dictionary
  description: 야구 규칙 설명 영상
  output_directory: output/baseball_dictionary

providers:
  image: nano_banana
  enhance: magnific
  video: higgsfield
  tts: edge_tts
  compose: ffmpeg

voice:
  speaker: ko-KR-SunHiNeural
  rate: "-5%"

video:
  resolution: 1920x1080
  fps: 30
  aspect_ratio: "16:9"

timeline:
  default_transition: none
  default_duration: 5.0

output:
  format: mp4
  overwrite: false
