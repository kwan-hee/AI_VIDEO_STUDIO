<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플레이리스트">
<title>플레이리스트 스튜디오</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar" id="topbar">
  <button class="back" id="back" aria-label="뒤로">←</button>
  <h1 id="title">플레이리스트 스튜디오</h1>
  <span class="env-dot" id="envdot" title="환경 상태"></span>
</header>

<main id="view"></main>

<div class="runbar" id="runbar">
  <span class="spin"></span>
  <span class="txt" id="runtxt">실행 중…</span>
  <button class="btn sm ghost" id="runlog">로그</button>
</div>

<div class="sheet" id="sheet">
  <div class="head">
    <strong id="sheettitle">로그</strong>
    <button class="btn sm ghost" id="sheetcopy">복사</button>
    <button class="btn sm ghost" id="sheetclose">닫기</button>
  </div>
  <pre id="sheetbody"></pre>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
