  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">

  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">

<div id="title"><div class="t1">말리의 동화나라 클래스</div><div class="t2">환상의 이야기 속으로 달려가요</div></div>

<script>
const DURATION = 23;
const NS = "http://www.w3.org/2000/svg";
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const show = (node, on) => node.setAttribute("opacity", on ? 1 : 0);

// 불꽃놀이 일정: [발사 시각, x, y, 색, 장면]
const FW = [
  [8.0, 210, 300, 0, "A"], [8.5, 470, 230, 1, "A"], [9.0, 600, 330, 0, "A"], [9.5, 130, 200, 2, "A"], [10.0, 380, 170, 0, "A"], [10.4, 560, 250, 1, "A"],
  [11.2, 540, 200, 0, "B"], [11.9, 160, 260, 2, "B"], [12.6, 620, 120, 0, "B"], [13.2, 380, 110, 1, "B"], [13.8, 90, 150, 0, "B"],
  [14.4, 560, 290, 2, "B"], [15.0, 300, 190, 0, "B"], [15.6, 650, 90, 1, "B"], [16.2, 170, 120, 0, "B"], [16.8, 470, 160, 2, "B"],
  [17.4, 610, 300, 0, "B"], [18.0, 260, 180, 1, "B"],
];
const FW_COLORS = [["#ffd27a", "#fff1c4"], ["#ffa6c9", "#ffe0ec"], ["#ffe9a8", "#ffffff"]];
const LAUNCH = 0.7, LIFE = 1.9;

// ---------- 장면 A 구성 ----------
const starsA = $("starsA");
const starA = [];
for (let i = 0; i < 70; i++) starA.push({ n: el("circle", { cx: rnd() * 720, cy: rnd() * 640, r: .8 + rnd() * 1.6, fill: "#fff" }, starsA), ph: rnd() * 6, sp: 1 + rnd() * 2 });

const cloudsG = $("clouds");
const clouds = [];
const CLOUD_DEF = [[120, 170, 1.25], [520, 120, 1.05], [860, 260, 1.2], [1180, 150, 1.0], [330, 380, 0.85], [1000, 420, 0.8]];
for (const [x, y, s] of CLOUD_DEF) {
  const g = el("g", {}, cloudsG);
  const puffs = [];
  for (let k = 0; k < 9; k++) puffs.push([(rnd() - .5) * 260, (rnd() - .7) * 90, 50 + rnd() * 50]);
  for (const [px, py, r] of puffs) el("circle", { cx: px, cy: py + 14, r, fill: "#9fb3cf" }, g);
  for (const [px, py, r] of puffs) el("circle", { cx: px - 6, cy: py, r: r * .92, fill: "#ffffff" }, g);
  for (const [px, py, r] of puffs.slice(0, 4)) el("circle", { cx: px - 14, cy: py - 12, r: r * .5, fill: "#fffaf0", opacity: .9 }, g);
  clouds.push({ g, x, y, s });
}

const treesA = $("treesA");
for (const [x, w] of [[40, 40], [110, 60], [230, 34], [520, 70], [600, 46], [690, 58]]) {
  el("ellipse", { cx: x, cy: 806, rx: w * .7, ry: 16, fill: "#3f6b45" }, treesA);
  el("ellipse", { cx: x + 8, cy: 800, rx: w * .45, ry: 12, fill: "#4d7d52" }, treesA);
}

// 성
const castle = $("castle");
(() => {
  const w = "url(#castleWall)", r = "url(#roof)", st = { stroke: "#b07f74", "stroke-width": 2 };
  const R = (x, y, wd, h) => el("rect", { x, y, width: wd, height: h, fill: w, ...st }, castle);
  const C = (cx, y, wd, h) => el("path", { d: `M${cx - wd / 2 - 4},${y} L${cx},${y - h} L${cx + wd / 2 + 4},${y}Z`, fill: r, stroke: "#36406a", "stroke-width": 2 }, castle);
  R(150, 750, 420, 70);
  for (let x = 150; x < 570; x += 20) R(x, 740, 12, 12);
  for (const [cx, top, wd, h] of [[160, 690, 30, 50], [560, 690, 30, 50], [240, 650, 34, 60], [480, 650, 34, 60]]) { R(cx - wd / 2, top, wd, 820 - top); C(cx, top, wd, h); }
  R(300, 640, 120, 180);
  for (const [cx, top, wd, h] of [[300, 600, 30, 70], [420, 600, 30, 70]]) { R(cx - wd / 2, top, wd, 820 - top); C(cx, top, wd, h); }
  R(338, 540, 44, 120); C(360, 540, 44, 110);
  R(352, 470, 16, 40); C(360, 470, 16, 40);
  el("path", { d: "M340,820 L340,790 Q360,770 380,790 L380,820Z", fill: "#7a5a5a" }, castle);
})();
const castleWin = el("g", {}, castle);
for (const [x, y] of [[352, 560], [362, 600], [318, 680], [392, 680], [318, 720], [392, 720], [236, 690], [476, 690], [236, 730], [476, 730], [292, 630], [414, 630], [180, 770], [540, 770], [260, 775], [460, 775]]) {
  el("rect", { x: x - 4, y: y - 7, width: 8, height: 13, rx: 4, fill: "#ffd27a" }, castleWin);
}
const castleGlow = el("circle", { cx: 360, cy: 720, r: 230, fill: "url(#warm)", opacity: 0 }, castle);
castle.insertBefore(castleGlow, castle.firstChild);

// 개울
const river = $("river");
el("path", { d: "M-20,1010 C60,990 110,1000 150,1030 C190,1060 120,1100 -20,1120Z", fill: "#a8c7e8", opacity: .85 }, river);
el("path", { d: "M-20,1030 C50,1015 95,1022 120,1040", fill: "none", stroke: "#fff", "stroke-width": 3, opacity: .6 }, river);

// 풀잎
const grassG = $("grass");
const blades = [];
for (let i = 0; i < 230; i++) {
  const y = 830 + Math.pow(rnd(), 0.8) * 460;
  const depth = (y - 820) / 460;
  const n = el("path", { stroke: ["#4f9a3e", "#6db352", "#3d8236", "#86c46a"][i % 4], "stroke-width": (1.2 + depth * 3.2).toFixed(1) }, grassG);
  blades.push({ n, x: rnd() * 900, y, h: 8 + depth * 46 * (0.6 + rnd() * .6), depth, ph: rnd() * 6 });
}

// 말리 옆모습 털
const fluff = (g, pts, base, out, hi) => {
  for (const [x, y, r] of pts) el("circle", { cx: x, cy: y, r: r + 3, fill: out }, g);
  for (const [x, y, r] of pts) el("circle", { cx: x, cy: y, r, fill: base }, g);
  if (hi) for (const [x, y, r] of pts) el("circle", { cx: x - r * .25, cy: y - r * .3, r: r * .45, fill: hi, opacity: .8 }, g);
};
fluff($("mBodyFluff"), [[-46, -82, 34], [-12, -92, 38], [24, -88, 36], [-30, -58, 30], [10, -60, 32], [40, -66, 28]], "#f3dfb8", "#b8925e", "#f9ecd4");
const mHeadS = $("mHeadS");
fluff($("mHeadFluff"), [[0, 0, 40], [-20, -28, 22], [14, -34, 22], [32, -12, 20], [-28, 6, 20], [6, 22, 22]], "#f3dfb8", "#b8925e", "#f9ecd4");
fluff($("mEarS"), [[-16, 8, 18], [-22, 28, 16], [-14, 44, 13]], "#e4c695", "#b8925e");
const mLegs = [...document.querySelectorAll(".mLeg")];

// ---------- 장면 B 구성 ----------
const starsB = $("starsB");
const starB = [];
for (let i = 0; i < 90; i++) starB.push({ n: el("circle", { cx: rnd() * 720, cy: rnd() * 800, r: .8 + rnd() * 1.8, fill: "#fff" }, starsB), ph: rnd() * 6, sp: 1 + rnd() * 2 });
const bokehB = $("bokehB");
const bokeh = [];
for (let i = 0; i < 14; i++) bokeh.push({ n: el("circle", { cx: rnd() * 720, cy: 200 + rnd() * 700, r: 20 + rnd() * 40, fill: "url(#bokeh)" }, bokehB), ph: rnd() * 6 });

const headPts = [];
for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; headPts.push([240 + Math.cos(a) * 112, 880 + Math.sin(a) * 104, 50 + (k % 3) * 6]); }
headPts.push([240, 880, 120], [200, 780, 46], [280, 780, 46], [240, 760, 50]);
fluff($("mHeadF"), headPts, "#f3dfb8", "#b8925e", "#f9ecd4");
fluff($("mEarsF"), [[118, 880, 52], [104, 950, 48], [112, 1020, 40], [362, 880, 52], [376, 950, 48], [368, 1020, 40]], "#e6c896", "#b08a58", "#efd6a8");
const chest = [];
for (let k = 0; k < 7; k++) chest.push([150 + k * 30, 1190 + (k % 2) * 24, 48]);
for (let k = 0; k < 6; k++) chest.push([150 + k * 36, 1270, 56]);
fluff($("mChest"), chest, "#f3dfb8", "#b8925e", "#f9ecd4");

// ---------- 불꽃 ----------
const fws = FW.map(([t0, x, y, c, sc]) => {
  const parent = $(sc === "A" ? "fwA" : "fwB");
  const g = el("g", {}, parent);
  const big = sc === "B" ? 1.35 : 1;
  const trail = el("line", { stroke: FW_COLORS[c][1], "stroke-width": 3, "stroke-linecap": "round" }, g);
  const parts = [];
  const N = 40;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2 + rnd() * .08;
    parts.push({ a, v: (150 + rnd() * 70) * big, n: el("line", { stroke: i % 3 ? FW_COLORS[c][0] : FW_COLORS[c][1], "stroke-width": (3.2 * big).toFixed(1), "stroke-linecap": "round" }, g) });
  }
  return { t0, x, y, g, trail, parts, sx: x + (rnd() - .5) * 60 };
});
const fwPos = (p, tau) => { const k = 2.2, d = p.v * (1 - Math.exp(-k * tau)) / k; return [Math.cos(p.a) * d, Math.sin(p.a) * d + 38 * tau * tau]; };
function renderFW(t) {
  let flash = 0;
  for (const f of fws) {
    const u = t - f.t0;
    if (u < 0 || u > LAUNCH + LIFE) { f.g.setAttribute("opacity", 0); continue; }
    f.g.setAttribute("opacity", 1);
    if (u < LAUNCH) {
      const k = u / LAUNCH, e = 1 - (1 - k) * (1 - k);
      const y0 = 900, yy = lerp(y0, f.y, e), xx = lerp(f.sx, f.x, e);
      f.trail.setAttribute("x1", xx); f.trail.setAttribute("y1", yy);
      f.trail.setAttribute("x2", xx + (f.sx - f.x) * .05); f.trail.setAttribute("y2", yy + 40);
      f.trail.setAttribute("opacity", .9);
      for (const p of f.parts) p.n.setAttribute("opacity", 0);
    } else {
      f.trail.setAttribute("opacity", 0);
      const tau = u - LAUNCH, fade = Math.pow(1 - tau / LIFE, 1.3);
      flash = Math.max(flash, Math.exp(-tau * 2.5));
      for (const p of f.parts) {
        const [x1, y1] = fwPos(p, Math.max(0, tau - .12)), [x2, y2] = fwPos(p, tau);
        p.n.setAttribute("x1", f.x + x1); p.n.setAttribute("y1", f.y + y1);
        p.n.setAttribute("x2", f.x + x2); p.n.setAttribute("y2", f.y + y2);
        p.n.setAttribute("opacity", (fade * (0.75 + 0.25 * Math.sin(tau * 30 + p.a * 7))).toFixed(3));
      }
    }
  }
  return flash;
}

// ---------- 달리기 속도와 걸음 위상 ----------
function speed(t) {
  if (t < 2) return 0;
  if (t < 3) return 120 * smooth(2, 3, t);
  if (t < 4) return 120;
  if (t < 5) return lerp(120, 400, smooth(4, 5, t));
  if (t < 9.4) return 400;
  return 400 * (1 - smooth(9.4, 10.4, t));
}
const TRAVEL = [], DT = 1 / 96;
{ let off = 0, ph = 0; for (let i = 0; i <= DURATION / DT + 1; i++) { TRAVEL.push([off, ph]); const t = i * DT, v = speed(t); off += v * DT; ph += (v > 1 ? 4 + v * 0.03 : 0) * DT; } }
const travel = t => TRAVEL[Math.min(TRAVEL.length - 1, Math.round(t / DT))];

const lEyes = [...document.querySelectorAll(".lEye")], mEyes = [...document.querySelectorAll(".mEye")];
const setEyes = (eyes, joy, blink, sx = 0, sy = 0) => {
  for (const e of eyes) {
    const o = e.querySelector(".open"), j = e.querySelector(".joy");
    o.setAttribute("opacity", joy ? 0 : 1); j.setAttribute("opacity", joy ? 1 : 0);
    o.setAttribute("transform", `translate(${sx},${sy}) scale(1,${Math.max(.08, blink)})`);
  }
};
const blinkAt = (t, list) => { let b = 1; for (const x of list) { const d = Math.abs(t - x); if (d < .1) b = Math.min(b, d / .1); } return b; };

function renderA(t) {
  const [off, ph] = travel(t), v = speed(t), run = v / 400;
  const dusk = smooth(5.0, 9.0, t);
  $("duskSky").setAttribute("opacity", dusk);
  $("duskTint").setAttribute("opacity", dusk * .35);
  $("duskGround").setAttribute("opacity", dusk * .45);
  for (const s of starA) s.n.setAttribute("opacity", (smooth(6.5, 9, t) * (.5 + .5 * Math.sin(t * s.sp + s.ph))).toFixed(3));
  for (const c of clouds) {
    const x = ((c.x - off * .12 - t * 6) % 1500 + 1500) % 1500 - 300;
    c.g.setAttribute("transform", `translate(${x},${c.y}) scale(${c.s * .82})`);
  }
  // 성: 노을이 질 무렵 지평선 위로 떠오른다
  const rise = smooth(5.4, 8.0, t);
  castle.setAttribute("transform", `translate(0,${lerp(260, 0, rise)})`);
  castle.setAttribute("opacity", smooth(5.4, 6.4, t));
  castleWin.setAttribute("opacity", smooth(7, 8.5, t));
  castleGlow.setAttribute("opacity", smooth(7, 9, t) * .8);
  $("river").setAttribute("transform", `translate(${lerp(-200, 0, smooth(7, 9.5, t))},0)`);
  // 풀잎
  for (const b of blades) {
    const x = ((b.x - off * (0.35 + b.depth * 1.1)) % 900 + 900) % 900 - 90;
    const sway = Math.sin(t * 2.2 + b.ph + x * .01) * (3 + b.depth * 6) + run * 4;
    b.n.setAttribute("d", `M${x.toFixed(1)},${b.y.toFixed(1)} q${(sway * .4).toFixed(1)},${(-b.h / 2).toFixed(1)} ${sway.toFixed(1)},${(-b.h).toFixed(1)}`);
  }
  // 릴리 (옆모습)
  const amp = v > 1 ? 14 + 24 * run : 0;
  const s = Math.sin(ph), bob = Math.abs(Math.sin(ph)) * (2 + 12 * run);
  const lx = lerp(300, 250, smooth(4, 9, t));
  const lilyScale = lerp(1.0, .82, smooth(3.5, 9.5, t));
  $("lilyS").setAttribute("transform", `translate(${lx},${1170 - bob}) scale(${lilyScale}) rotate(${(5 * run).toFixed(2)})`);
  $("legFront").setAttribute("transform", `translate(0,-250) rotate(${(-amp * s).toFixed(2)})`);
  $("legBack").setAttribute("transform", `translate(0,-250) rotate(${(amp * s).toFixed(2)})`);
  $("armFront").setAttribute("transform", `translate(0,-432) rotate(${(amp * 1.2 * s + 8 * run).toFixed(2)})`);
  $("armBack").setAttribute("transform", `translate(0,-432) rotate(${(-amp * 1.2 * s + 8 * run).toFixed(2)})`);
  const look = t < 2 ? -14 : t < 10.2 ? lerp(-14, -2, smooth(2, 3, t)) : lerp(-2, -22, smooth(10.2, 10.8, t));
  $("lilyHead").setAttribute("transform", `translate(14,-522) rotate(${look.toFixed(2)})`);
  const sw = 10 + 46 * run + Math.sin(ph * 2) * 5 * run + Math.sin(t * 1.5) * 4;
  $("hairBack").setAttribute("d", `M-30,-560 C-80,-520 ${-90 - sw * .5},-430 ${-104 - sw},-330 C${-80 - sw * .7},-322 -50,-340 -30,-370 C-14,-420 0,-470 10,-520Z`);
  $("lilySMouth").setAttribute("d", t > 10.4 ? "M36,30 Q46,44 56,29" : "M38,32 Q46,38 54,31");
  // 말리 (옆모습)
  const mph = ph * 1.5, ms = Math.sin(mph), mrun = run;
  const mbob = Math.abs(Math.sin(mph)) * (1 + 10 * mrun);
  const mx = lerp(470, 430, smooth(4, 9, t)), mScale = lerp(1.0, .85, smooth(3.5, 9.5, t));
  $("malliS").setAttribute("transform", `translate(${mx},${1200 - mbob}) scale(${mScale})`);
  mLegs.forEach((g, i) => {
    const a = (v > 1 ? 10 + 28 * mrun : 0) * ms * (i % 2 ? 1 : -1) * (g.dataset.back ? -1 : 1);
    g.setAttribute("transform", `translate(${g.dataset.x},-52) rotate(${a.toFixed(2)})`);
  });
  const mLook = t < 2 ? -18 : t > 10.3 ? lerp(0, -24, smooth(10.3, 10.9, t)) : 0;
  mHeadS.setAttribute("transform", `translate(62,-140) rotate(${mLook + Math.sin(mph) * 3 * mrun})`);
  $("mTail").setAttribute("transform", `translate(-72,-98) rotate(${Math.sin(t * 14) * 18})`);
  $("mTongueS").setAttribute("opacity", run > .3 || t > 10.4 ? 1 : 0);
}

function renderB(t) {
  const k = clamp((t - 10.8) / 8);
  for (const s of starB) s.n.setAttribute("opacity", (.4 + .6 * Math.sin(t * s.sp + s.ph) ** 2).toFixed(3));
  for (const b of bokeh) b.n.setAttribute("opacity", (.4 + .4 * Math.sin(t * .8 + b.ph)).toFixed(3));
  const sc = lerp(1.0, 1.08, smooth(10.8, 19, t));
  $("camB").setAttribute("transform", `translate(360,800) scale(${sc}) translate(-360,-800)`);
  // 표정 단계: 놀람 → 웃음 → 눈웃음
  const phase = t < 13.2 ? 0 : t < 15.0 ? 1 : 2;
  const lean = smooth(15.0, 16.2, t);
  $("lilyF").setAttribute("transform", `translate(${-34 * lean},${10 * lean}) rotate(${-6 * lean} 442 900)`);
  $("malliF").setAttribute("transform", `translate(${22 * lean},${-6 * lean}) rotate(${5 * lean} 240 1050)`);
  const lookUp = phase === 0 ? -8 : -4;
  setEyes(lEyes, phase === 2, blinkAt(t, [12.4, 14.2]), 0, lookUp);
  setEyes(mEyes, phase === 2 && t > 15.3, blinkAt(t, [12.9, 14.6]), 0, phase === 0 ? -5 : -2);
  show($("lMouthO"), phase === 0); show($("lMouthSmile"), phase === 1); show($("lMouthLaugh"), phase === 2);
  const brow = phase === 0 ? -10 : phase === 1 ? -6 : 0;
  $("browL").setAttribute("transform", `translate(0,${brow})`); $("browR").setAttribute("transform", `translate(0,${brow})`);
  const blush = phase === 2 ? .7 : .5;
  $("lilyBlushL").setAttribute("opacity", blush); $("lilyBlushR").setAttribute("opacity", blush);
  // 말리 입: 살짝 벌림 → 활짝 → 혀 내밀고 웃음 (말하듯 헐떡임)
  const pant = Math.abs(Math.sin(t * 7));
  const open = phase === 0 ? .35 + .15 * pant : phase === 1 ? .7 + .2 * pant : .95 + .05 * pant;
  $("mMouthPath").setAttribute("d", `M${200 - 6 * open},940 Q240,${950 + 60 * open} ${280 + 6 * open},940Z`);
  $("mTongueF").setAttribute("ry", (10 + 18 * open).toFixed(1));
  $("mTongueF").setAttribute("cy", (950 + 30 * open).toFixed(1));
  $("malliFHead").setAttribute("transform", `rotate(${Math.sin(t * 3) * 1.5} 240 1000)`);
}

const sceneA = $("sceneA"), sceneB = $("sceneB");
function render(t) {
  const xf = smooth(10.6, 11.4, t);
  sceneA.setAttribute("opacity", 1 - xf);
  sceneB.setAttribute("opacity", xf);
  sceneA.style.display = xf >= 1 ? "none" : "";
  sceneB.style.display = xf <= 0 ? "none" : "";
  const flash = renderFW(t);
  if (xf < 1) renderA(t);
  if (xf > 0) renderB(t);
  $("flash").setAttribute("opacity", (flash * .55).toFixed(3));
  // 마무리: 크림색 화면과 제목
  $("cream").setAttribute("opacity", smooth(18.4, 20.4, t) * .86);
  document.getElementById("title").style.opacity = smooth(19.4, 20.6, t);
  document.getElementById("fade").style.opacity = smooth(22.3, 23, t);
}
window.render = render;
window.DURATION = DURATION;

if (!/capture/.test(location.search)) {
  let start = performance.now();
  const loop = now => { let t = (now - start) / 1000; if (t > DURATION + 1) { start = now; t = 0; } render(Math.min(t, DURATION)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else render(0);
</script>
</body>
</html>
